<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in to Cited</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%2308120d'/%3E%3Cpath d='M15 8H9v24h6M25 8h6v24h-6' stroke='%23e9e3d5' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M20 11l2.6 6.4L29 20l-6.4 2.6L20 29l-2.6-6.4L11 20l6.4-2.6z' fill='%2335e08a'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css?v=2" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="wordmark" href="/" style="margin-bottom:8px"><svg width="26" height="26" viewBox="0 0 40 40" role="img" aria-hidden="true">
        <path d="M15 8H9v24h6M25 8h6v24h-6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 11l2.6 6.4L29 20l-6.4 2.6L20 29l-2.6-6.4L11 20l6.4-2.6z" fill="var(--you)"/>
      </svg><span class="wordmark-text">Cit<em>ed</em></span><span class="beta" title="Cited is in beta. Things will change, and your feedback shapes what changes.">beta</span></a>
    <p class="eyebrow">Answer engine visibility</p>

    <form class="panel" id="panel">
      <h2 id="formTitle">Sign in</h2>
      <p class="dek" style="margin:8px 0 20px;font-size:14px">Track what ChatGPT, Gemini and Perplexity say about your brand, and what to do about it.</p>

      <div class="field" id="orgField" hidden>
        <label for="orgName">Company (optional)</label>
        <input id="orgName" autocomplete="organization" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" required autofocus />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button type="button" class="ghost" id="showPassword" aria-controls="password" aria-pressed="false">Show password</button>
        <p class="hint" id="passwordHint" hidden>Use at least 8 characters.</p>
      </div>

      <button type="submit" id="submit" style="width:100%">Sign in</button>
      <p class="error" id="error" role="alert"></p>
      <p class="switch">
        <a href="#" id="toggle">Create an account instead</a>
        <a href="#" id="forgot">Forgotten your password?</a>
      </p>
    </form>
  </div>
</div>

<script src="/demo-handoff.js?v=119"></script>
<script src="/login.js?v=1"></script>
<script src="/feedback.js"></script>
</body>
</html>
