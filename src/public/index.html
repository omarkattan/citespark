<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cited</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="wordmark">Cit<span>ed</span></div>
    <div class="meta" id="cycleMeta"></div>
    <div class="spacer"></div>
    <select id="projectPicker" style="width:auto;min-width:200px"></select>
    <button class="ghost" id="addSiteBtn">Add site</button>
    <button class="ghost" id="runBtn">Run cycle</button>
    <button class="ghost" id="signOut">Sign out</button>
  </div>
</header>

<main>
  <div id="mockNotice" class="notice" hidden>Mock mode is on. Answers are simulated, nothing is being spent, and the recommendations are built from the simulated data.</div>

  <p class="eyebrow">What to do next</p>
  <h1 id="brandTitle">Loading</h1>
  <p class="dek" id="brandDek"></p>

  <div class="figures" id="figures"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-view="actions">Actions</button>
    <button class="tab" role="tab" aria-selected="false" data-view="questions">Questions</button>
    <button class="tab" role="tab" aria-selected="false" data-view="rivals">Share of voice</button>
    <button class="tab" role="tab" aria-selected="false" data-view="sources">Sources</button>
    <button class="tab" role="tab" aria-selected="false" data-view="traffic">Traffic</button>
    <button class="tab" role="tab" aria-selected="false" data-view="setup">Setup</button>
  </div>

  <section id="view"></section>
</main>

<dialog id="siteDialog" class="sheet">
  <form method="dialog" id="siteForm">
    <h2>Add a site</h2>
    <p class="dek" style="margin:8px 0 20px;font-size:13.5px">We generate the question set from this, so the category and customer description matter more than the name.</p>

    <div class="field"><label for="f_brand">Brand name as customers say it</label><input id="f_brand" placeholder="Sandstorm Digital" /></div>
    <div class="field"><label for="f_domain">Domain</label><input id="f_domain" placeholder="sandstormdigital.com" /></div>
    <div class="field"><label for="f_category">What the business does</label><input id="f_category" placeholder="SEO and digital marketing agency" /></div>
    <div class="field"><label for="f_qualifier">Who the customer is</label><input id="f_qualifier" placeholder="UK ecommerce brands turning over 1m to 20m" /></div>
    <div class="field"><label for="f_market">Market</label><input id="f_market" value="GB" maxlength="2" style="width:90px" /></div>
    <div class="field">
      <label for="f_rivals">Competitors, one per line, name then comma then domain</label>
      <textarea id="f_rivals" rows="5" placeholder="Impression, impression.co.uk&#10;Rise at Seven, riseatseven.com"></textarea>
    </div>

    <p class="error" id="siteError" role="alert"></p>
    <div class="sheet-foot">
      <button type="button" class="ghost" id="siteCancel">Cancel</button>
      <button type="button" id="siteSave">Create and write questions</button>
    </div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
