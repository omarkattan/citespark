# Render blueprint. In Render: New > Blueprint > point at this repo.
services:
  - type: web
    name: cited
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run migrate
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Every other hostname 301s here. Leave unset to serve on any host.
      - key: CANONICAL_HOST
        value: cited.ae
      # Where to send trials, signups, payments and feedback as they happen.
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: NOTIFY_FROM
        value: Cited <notifications@cited.ae>
      # Public demo. Every run costs real money with nobody paying for it, so
      # these caps are what stand between you and a bad afternoon.
      - key: DEMO_RUNS
        value: "3"
      - key: DEMO_PER_IP_HOUR
        value: "2"
      - key: DEMO_PER_IP_DAY
        value: "3"
      - key: DEMO_DAILY_BUDGET
        value: "15"
      - key: DEMO_CACHE_HOURS
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: cited-db
          property: connectionString
      # Set in the dashboard, not here. A hardcoded value would be re-applied
      # on every blueprint sync and silently switch a live service back to
      # simulated answers. Leave unset for real data; set to "true" only for
      # a demo environment.
      - key: MOCK_MODE
        sync: false
      - key: ENGINES
        value: chatgpt,gemini,perplexity
      - key: MAX_OUTPUT_TOKENS
        value: "700"
      - key: CONCURRENCY
        value: "4"
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TOKEN_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GA4_PROPERTY_ID
        sync: false
      - key: COST_PER_CALL
        value: "0.03"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_STARTER_ANNUAL
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_GROWTH_ANNUAL
        sync: false
      - key: STRIPE_PRICE_AGENCY
        sync: false
      - key: STRIPE_PRICE_AGENCY_ANNUAL
        sync: false

  # Morning summary: trials, signups, feedback and spend.
  - type: cron
    name: cited-daily-digest
    runtime: node
    plan: starter
    schedule: "0 5 * * *"
    buildCommand: npm ci
    startCommand: npm run digest
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cited-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: NOTIFY_FROM
        value: Cited <notifications@cited.ae>
      - key: CANONICAL_HOST
        value: cited.ae

  - type: cron
    name: cited-weekly-cycle
    runtime: node
    plan: starter
    schedule: "0 6 * * 1"
    buildCommand: npm ci
    startCommand: npm run cycle
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cited-db
          property: connectionString
      # Set in the dashboard, not here. A hardcoded value would be re-applied
      # on every blueprint sync and silently switch a live service back to
      # simulated answers. Leave unset for real data; set to "true" only for
      # a demo environment.
      - key: MOCK_MODE
        sync: false
      - key: ENGINES
        value: chatgpt,gemini,perplexity
      - key: MAX_OUTPUT_TOKENS
        value: "700"
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: cited-db
    plan: basic-256mb
